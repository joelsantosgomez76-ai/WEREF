<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto | WEREF</title>
<meta name="description" content="¿Tienes dudas, sugerencias o has encontrado un error en las preguntas? Escríbenos desde este formulario.">
<link rel="canonical" href="https://we-ref.com/contacto.html">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="landing-nav">
  <a href="index.html" class="landing-brand" style="text-decoration:none;">
    <span class="mark"><svg viewBox="0 0 48 48" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="10" width="18" height="26" rx="4" fill="#16181D" stroke="#fff" stroke-width="2" transform="rotate(-14 14 23)"/>
      <rect x="25" y="12" width="18" height="26" rx="4" fill="#FF6A2B" transform="rotate(14 34 25)"/>
    </svg></span>
    WEREF
  </a>
  <div class="landing-nav-actions">
    <a href="index.html" class="btn btn-ghost" style="text-decoration:none;">Volver al inicio</a>
  </div>
</nav>

<section class="landing-section" style="max-width:520px;">
  <h1 style="font-size:26px; color:var(--pitch); margin-bottom:6px; text-align:center;">Contacta con nosotros</h1>
  <p style="font-size:14px; color:var(--muted); margin-bottom:26px; text-align:center;">¿Dudas, sugerencias o un error en alguna pregunta? Escríbenos y te responderemos por correo.</p>

  <form id="contact-form">
    <label for="contact-name">Nombre</label>
    <input type="text" id="contact-name" autocomplete="name" required maxlength="100">

    <label for="contact-email">Correo electrónico</label>
    <input type="email" id="contact-email" autocomplete="email" required maxlength="254">

    <label for="contact-message">Mensaje</label>
    <textarea id="contact-message" rows="5" required maxlength="3000"></textarea>

    <!-- Campo trampa para bots: oculto para personas, si llega relleno se descarta el envío -->
    <div style="position:absolute; left:-9999px;" aria-hidden="true">
      <label for="contact-website">No rellenar este campo</label>
      <input type="text" id="contact-website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" class="btn btn-primary auth-submit" id="contact-submit">Enviar mensaje</button>
    <div class="auth-error" id="contact-error" style="display:none;"></div>
    <div class="auth-error" id="contact-success" style="display:none; background:#EAF7EE; color:#1E7A34;"></div>
  </form>
</section>

<footer class="landing-footer">
  <p><a href="index.html" style="color:var(--muted);">Inicio</a> · <a href="politica-privacidad.html" style="color:var(--muted);">Política de Privacidad</a> · <a href="terminos-de-uso.html" style="color:var(--muted);">Términos de Uso</a></p>
  WEREF · Formación Arbitral — Contenido no oficial, basado en las Reglas de Juego IFAB.
</footer>

<script src="assets/js/supabase-init.js"></script>
<script>
const cf = {
  form: document.getElementById('contact-form'),
  name: document.getElementById('contact-name'),
  email: document.getElementById('contact-email'),
  message: document.getElementById('contact-message'),
  website: document.getElementById('contact-website'),
  submit: document.getElementById('contact-submit'),
  error: document.getElementById('contact-error'),
  success: document.getElementById('contact-success'),
};

cf.form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  cf.error.style.display = 'none';
  cf.success.style.display = 'none';

  if(cf.website.value.trim() !== ''){
    return;
  }

  cf.submit.disabled = true;
  try{
    const { error } = await supabaseClient.from('contact_messages').insert({
      name: cf.name.value.trim(),
      email: cf.email.value.trim(),
      message: cf.message.value.trim(),
    });
    if(error) throw error;
    cf.success.textContent = '¡Mensaje enviado! Te responderemos lo antes posible.';
    cf.success.style.display = 'block';
    cf.form.reset();
  } catch(err){
    cf.error.textContent = 'No se ha podido enviar el mensaje. Inténtalo de nuevo en unos minutos.';
    cf.error.style.display = 'block';
  } finally {
    cf.submit.disabled = false;
  }
});
</script>
</body>
</html>
