<figure class="cx-fig">
  <svg viewBox="0 0 460 230" role="img" aria-labelledby="fsb-t fsb-d">

    <desc id="fsb-d">El jugador que saca está de cara al campo, con una parte de cada pie sobre la línea de banda o fuera de ella, y lanza el balón con las dos manos desde detrás y por encima de la cabeza. Los adversarios deben estar al menos a 2 m del punto del saque.</desc>

    <line x1="0" y1="150" x2="460" y2="150" stroke="#F4F2EA" stroke-width="3"/>
    <circle class="fg-off" fill="none" cx="230" cy="150" r="40"/>
    <circle class="fg-dfn" cx="178" cy="108" r="9"/><circle class="fg-dfn" cx="290" cy="112" r="9"/><circle class="fg-a" cx="330" cy="78" r="9"/>
    <rect x="215" y="146" width="12" height="7" rx="2" fill="#FFC83D"/><rect x="233" y="146" width="12" height="7" rx="2" fill="#FFC83D"/>
    <circle class="fg-a" cx="230" cy="168" r="9"/>
    <circle class="fg-ball" cx="230" cy="150" r="5"/>

      <text x="14" y="44" class="fg-s">de cara al campo · una parte de cada pie en la línea o fuera</text>
      <text x="14" y="196" class="fg-s">lanza con las dos manos, desde detrás y por encima de la cabeza</text>
      <text x="250" y="142" class="fg-s">2 m</text>
      <text x="14" y="214" class="fg-s fg-mute">Fuera del campo</text>
    </g>
  </svg>
  <figcaption>Esquema visto desde arriba, sin escala exacta. Los adversarios deben estar al menos a 2 m del punto de la línea de banda desde donde se saca.</figcaption>
</figure>
