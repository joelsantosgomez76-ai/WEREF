<figure class="cx-fig">
  <svg viewBox="0 0 520 170" role="img" aria-labelledby="ft-t ft-d">
    <title id="ft-t">Línea de tiempo de un partido</title>
    <desc id="ft-d">Dos tiempos iguales de 45 minutos separados por un descanso de hasta 15 minutos. Al final de cada tiempo se añade el tiempo perdido. Si hay prórroga, son dos períodos iguales de no más de 15 minutos.</desc>
    <rect class="fg-bg" width="520" height="170" rx="14"/>
    <rect x="24" y="44" width="190" height="36" rx="6" fill="#FFC83D"/><rect x="214" y="44" width="22" height="36" fill="#FF6A2B"/>
    <rect x="236" y="44" width="48" height="36" rx="6" fill="none" stroke="#D5D8DF" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="284" y="44" width="190" height="36" rx="6" fill="#FFC83D"/><rect x="474" y="44" width="22" height="36" fill="#FF6A2B"/>
    <g class="fg-t">
      <text x="119" y="67" text-anchor="middle" class="fg-ink">1.er tiempo · 45 min</text>
      <text x="379" y="67" text-anchor="middle" class="fg-ink">2.º tiempo · 45 min</text>
      <text x="260" y="104" text-anchor="middle" class="fg-s">descanso: hasta 15 min</text>
      <text x="225" y="30" text-anchor="middle" class="fg-s">+ tiempo añadido</text>
      <text x="485" y="30" text-anchor="middle" class="fg-s">+ tiempo añadido</text>
      <text x="24" y="146" class="fg-s">Si hace falta ganador: prórroga de 2 períodos iguales de no más de 15 min.</text>
    </g>
  </svg>
  <figcaption>El tiempo añadido (naranja) se suma a cada tiempo: el árbitro puede aumentarlo, pero no reducirlo.</figcaption>
</figure>
