<figure class="cx-fig cx-scenes">
  <div class="cx-scenes-g">
    <div class="cx-scene">
      <svg viewBox="0 0 320 170" role="img" aria-labelledby="bj-a-t bj-a-d">
        <title id="bj-a-t">Balón que sigue en juego</title>
        <desc id="bj-a-d">El balón toca la línea de banda pero una parte sigue sobre ella, así que no ha traspasado la línea por completo y sigue en juego.</desc>
        <rect class="fg-bg" width="320" height="170" rx="12"/>
        <rect x="0" y="84" width="320" height="86" fill="#1F232B"/>
        <line x1="0" y1="84" x2="320" y2="84" stroke="#F4F2EA" stroke-width="3"/>
        <circle class="fg-ball" cx="160" cy="84" r="16"/>
        <g class="fg-t"><text x="14" y="28" class="fg-s">Dentro del campo</text><text x="14" y="154" class="fg-s fg-mute">Fuera del campo</text><text x="190" y="62" class="fg-s">sigue tocando la línea</text></g>
      </svg>
      <p><strong>En juego.</strong> Basta con que una parte del balón esté sobre la línea.</p>
    </div>
    <div class="cx-scene">
      <svg viewBox="0 0 320 170" role="img" aria-labelledby="bj-b-t bj-b-d">
        <title id="bj-b-t">Balón fuera de juego</title>
        <desc id="bj-b-d">Todo el balón ha traspasado por completo la línea de banda, así que está fuera de juego.</desc>
        <rect class="fg-bg" width="320" height="170" rx="12"/>
        <rect x="0" y="84" width="320" height="86" fill="#1F232B"/>
        <line x1="0" y1="84" x2="320" y2="84" stroke="#F4F2EA" stroke-width="3"/>
        <circle class="fg-ball" cx="160" cy="118" r="16"/>
        <g class="fg-t"><text x="14" y="28" class="fg-s">Dentro del campo</text><text x="14" y="154" class="fg-s fg-mute">Fuera del campo</text><text x="190" y="122" class="fg-s">todo el balón fuera</text></g>
      </svg>
      <p><strong>Fuera de juego.</strong> Todo el balón ha traspasado la línea, por el suelo o por el aire.</p>
    </div>
  </div>
</figure>
