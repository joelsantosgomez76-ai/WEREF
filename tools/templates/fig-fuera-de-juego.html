<figure class="cx-fig cx-scenes">
  <div class="cx-scenes-g">
    <div class="cx-scene" id="esc-a">
      <svg viewBox="0 0 320 240" role="img" aria-labelledby="fo-a-t fo-a-d">
        <title id="fo-a-t">Atacante en posición de fuera de juego</title>
        <desc id="fo-a-d">Visto desde arriba, el equipo ataca hacia la portería superior. El atacante está más cerca de la línea de meta que el balón y que el penúltimo adversario, así que está en posición de fuera de juego.</desc>
        <rect class="fg-bg" width="320" height="240" rx="12"/>
        <rect class="fg-goal" x="130" y="8" width="60" height="8" rx="1.5"/>
        <g class="fg-l" fill="none"><line x1="16" y1="18" x2="304" y2="18"/></g>
        <line class="fg-off" x1="16" y1="100" x2="304" y2="100"/>
        <circle class="fg-gk" cx="160" cy="38" r="9"/>
        <circle class="fg-dfn" cx="226" cy="100" r="9"/>
        <circle class="fg-dfn" cx="84" cy="156" r="9"/>
        <circle class="fg-ring" cx="104" cy="70" r="15"/>
        <circle class="fg-a" cx="104" cy="70" r="9"/>
        <circle class="fg-a" cx="186" cy="188" r="9"/>
        <circle class="fg-ball" cx="170" cy="176" r="5"/>
        <g class="fg-t"><text x="20" y="116" class="fg-s">penúltimo adversario</text></g>
        <path class="fg-arrow" d="M300 226V184M294 192L300 184L306 192"/>
      </svg>
      <p><strong>A · Posición de fuera de juego.</strong> Más cerca de la meta rival que el balón y que el penúltimo adversario.</p>
    </div>
    <div class="cx-scene" id="esc-b">
      <svg viewBox="0 0 320 240" role="img" aria-labelledby="fo-b-t fo-b-d">
        <title id="fo-b-t">Atacante a la misma altura del penúltimo adversario</title>
        <desc id="fo-b-d">El atacante está en la misma línea que el penúltimo adversario, por lo que no está en posición de fuera de juego.</desc>
        <rect class="fg-bg" width="320" height="240" rx="12"/>
        <rect class="fg-goal" x="130" y="8" width="60" height="8" rx="1.5"/>
        <g class="fg-l" fill="none"><line x1="16" y1="18" x2="304" y2="18"/></g>
        <line class="fg-off" x1="16" y1="100" x2="304" y2="100"/>
        <circle class="fg-gk" cx="160" cy="38" r="9"/>
        <circle class="fg-dfn" cx="226" cy="100" r="9"/>
        <circle class="fg-dfn" cx="84" cy="156" r="9"/>
        <circle class="fg-ring" cx="104" cy="100" r="15"/>
        <circle class="fg-a" cx="104" cy="100" r="9"/>
        <circle class="fg-a" cx="186" cy="188" r="9"/>
        <circle class="fg-ball" cx="170" cy="176" r="5"/>
        <g class="fg-t"><text x="20" y="86" class="fg-s">misma altura</text></g>
        <path class="fg-arrow" d="M300 226V184M294 192L300 184L306 192"/>
      </svg>
      <p><strong>B · A la misma altura.</strong> Estar en línea con el penúltimo adversario no es posición de fuera de juego.</p>
    </div>
    <div class="cx-scene" id="esc-c">
      <svg viewBox="0 0 320 240" role="img" aria-labelledby="fo-c-t fo-c-d">
        <title id="fo-c-t">Atacante en su propio campo</title>
        <desc id="fo-c-d">El atacante está más cerca de la meta rival que el penúltimo adversario, pero se encuentra en su propio campo, por detrás de la línea de medio campo, así que no puede estar en fuera de juego.</desc>
        <rect class="fg-bg" width="320" height="240" rx="12"/>
        <rect class="fg-goal" x="130" y="8" width="60" height="8" rx="1.5"/>
        <g class="fg-l" fill="none"><line x1="16" y1="18" x2="304" y2="18"/><line x1="16" y1="124" x2="304" y2="124"/></g>
        <line class="fg-off" x1="16" y1="196" x2="304" y2="196"/>
        <circle class="fg-gk" cx="160" cy="38" r="9"/>
        <circle class="fg-dfn" cx="226" cy="196" r="9"/>
        <circle class="fg-ring" cx="104" cy="166" r="15"/>
        <circle class="fg-a" cx="104" cy="166" r="9"/>
        <circle class="fg-a" cx="170" cy="222" r="9"/>
        <circle class="fg-ball" cx="154" cy="214" r="5"/>
        <g class="fg-t"><text x="20" y="116" class="fg-s">medio campo</text></g>
        <path class="fg-arrow" d="M300 226V184M294 192L300 184L306 192"/>
      </svg>
      <p><strong>C · En su propio campo.</strong> Quien está en su mitad del campo no puede estar en fuera de juego.</p>
    </div>
    <div class="cx-scene" id="esc-d">
      <svg viewBox="0 0 320 240" role="img" aria-labelledby="fo-d-t fo-d-d">
        <title id="fo-d-t">Partes del cuerpo que cuentan para el fuera de juego</title>
        <desc id="fo-d-d">Silueta de un jugador. La cabeza, el cuerpo y los pies cuentan para decidir la posición. Las manos y los brazos no cuentan; el límite superior del brazo está en la línea inferior de la axila.</desc>
        <rect class="fg-bg" width="320" height="240" rx="12"/>
        <g class="fg-body">
          <circle cx="160" cy="46" r="17"/>
          <rect x="138" y="68" width="44" height="68" rx="10"/>
          <rect x="140" y="134" width="16" height="64" rx="6"/>
          <rect x="164" y="134" width="16" height="64" rx="6"/>
          <rect x="134" y="196" width="26" height="12" rx="5"/>
          <rect x="164" y="196" width="26" height="12" rx="5"/>
        </g>
        <g class="fg-arm"><line x1="140" y1="84" x2="96" y2="124"/><line x1="180" y1="84" x2="228" y2="52"/></g>
        <line class="fg-off" x1="106" y1="86" x2="214" y2="86"/>
        <g class="fg-t"><text x="14" y="30">Cuentan:</text><text x="14" y="46" class="fg-s">cabeza, cuerpo y pies</text><text x="14" y="228" class="fg-s fg-mute">No cuentan: manos y brazos</text><text x="222" y="104" class="fg-s">axila</text></g>
      </svg>
      <p><strong>D · Qué cuenta.</strong> Cabeza, cuerpo y pies sí. Manos y brazos no, hasta la línea inferior de la axila.</p>
    </div>
  </div>
  <figcaption>Esquemas vistos desde arriba (A, B y C): el equipo amarillo ataca hacia la portería de arriba. Amarillo: atacantes · gris: defensores · naranja: portero · blanco: balón.</figcaption>
</figure>
