<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Restablecer contraseña | WEREF</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='5' y='10' width='18' height='26' rx='4' fill='%2316181D' transform='rotate(-14 14 23)'/%3E%3Crect x='25' y='12' width='18' height='26' rx='4' fill='%23FF6A2B' transform='rotate(14 34 25)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="landing-nav">
  <a href="index.html" class="landing-brand" style="text-decoration:none;">
    <span class="mark"><svg viewBox="0 0 48 48" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="10" width="18" height="26" rx="4" fill="#16181D" stroke="#fff" stroke-width="2" transform="rotate(-14 14 23)"/>
      <rect x="25" y="12" width="18" height="26" rx="4" fill="#FF6A2B" transform="rotate(14 34 25)"/>
    </svg></span>
    WEREF
  </a>
</nav>

<section class="landing-section" style="max-width:420px;">
  <h1 style="font-size:24px; color:var(--pitch); margin-bottom:6px; text-align:center;">Crear nueva contraseña</h1>
  <p id="rp-sub" style="font-size:14px; color:var(--muted); margin-bottom:22px; text-align:center;">Comprobando el enlace...</p>

  <form id="rp-form" style="display:none;">
    <label for="rp-password">Nueva contraseña</label>
    <input type="password" id="rp-password" autocomplete="new-password" required minlength="8" maxlength="128">
    <div style="font-size:12px; color:var(--muted); margin-top:6px;">Mínimo 8 caracteres, con mayúsculas, minúsculas, números y un carácter especial.</div>
    <label for="rp-password2">Repite la contraseña</label>
    <input type="password" id="rp-password2" autocomplete="new-password" required minlength="8" maxlength="128">
    <button type="submit" class="btn btn-primary auth-submit" id="rp-submit">Guardar contraseña</button>
    <div class="auth-error" id="rp-error" style="display:none;"></div>
  </form>

  <div id="rp-invalid" style="display:none; text-align:center;">
    <p style="font-size:14px; color:var(--muted); margin-bottom:16px;">Este enlace no es válido o ha caducado. Solicita uno nuevo desde la pantalla de inicio de sesión.</p>
    <a href="index.html" class="btn btn-primary" style="text-decoration:none;">Volver al inicio</a>
  </div>
</section>

<script src="assets/js/supabase-init.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const rp = {
  sub: document.getElementById('rp-sub'),
  form: document.getElementById('rp-form'),
  password: document.getElementById('rp-password'),
  password2: document.getElementById('rp-password2'),
  submit: document.getElementById('rp-submit'),
  error: document.getElementById('rp-error'),
  invalid: document.getElementById('rp-invalid'),
};

let recoveryReady = false;

function showForm(){
  if(recoveryReady) return;
  recoveryReady = true;
  rp.sub.textContent = 'Elige una nueva contraseña para tu cuenta.';
  rp.form.style.display = 'block';
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY'){ showForm(); }
});

(async function checkSession(){
  const { data } = await supabaseClient.auth.getSession();
  if(data && data.session){ showForm(); }
  setTimeout(()=>{
    if(!recoveryReady){
      rp.sub.style.display = 'none';
      rp.invalid.style.display = 'block';
    }
  }, 3000);
})();

rp.form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  rp.error.style.display = 'none';
  if(rp.password.value !== rp.password2.value){
    rp.error.textContent = 'Las dos contraseñas no coinciden.';
    rp.error.style.display = 'block';
    return;
  }
  if(!isStrongPassword(rp.password.value)){
    rp.error.textContent = PASSWORD_POLICY_MESSAGE;
    rp.error.style.display = 'block';
    return;
  }
  rp.submit.disabled = true;
  try{
    const { error } = await supabaseClient.auth.updateUser({ password: rp.password.value });
    if(error) throw error;
    rp.sub.textContent = '¡Contraseña actualizada! Entrando en la app...';
    rp.form.style.display = 'none';
    setTimeout(()=>{ window.location.href = 'app.html'; }, 1200);
  } catch(err){
    rp.error.textContent = authErrorMessage(err);
    rp.error.style.display = 'block';
    rp.submit.disabled = false;
  }
});
</script>
</body>
</html>
