<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WEREF · Formación Arbitral</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='5' y='10' width='18' height='26' rx='4' fill='%2316181D' transform='rotate(-14 14 23)'/%3E%3Crect x='25' y='12' width='18' height='26' rx='4' fill='%23FF6A2B' transform='rotate(14 34 25)'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><svg viewBox="0 0 48 48" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="10" width="18" height="26" rx="4" fill="#16181D" stroke="#fff" stroke-width="2" transform="rotate(-14 14 23)"/>
      <rect x="25" y="12" width="18" height="26" rx="4" fill="#FF6A2B" transform="rotate(14 34 25)"/>
    </svg></div>
    <h1 class="auth-title" id="auth-title">Iniciar sesión</h1>
    <div class="auth-sub" id="auth-sub">Entra para seguir con tu formación arbitral</div>

    <form id="auth-form">
      <label for="auth-email">Correo electrónico</label>
      <input type="email" id="auth-email" autocomplete="email" required>
      <label for="auth-password">Contraseña</label>
      <input type="password" id="auth-password" autocomplete="current-password" required minlength="6">
      <button type="submit" class="btn btn-primary auth-submit" id="auth-submit">Entrar</button>
      <div class="auth-error" id="auth-error" style="display:none;"></div>
    </form>

    <div class="auth-switch">
      <span id="auth-switch-text">¿Todavía no tienes cuenta?</span>
      <button type="button" id="auth-switch-btn">Regístrate</button>
    </div>
  </div>
</div>

<script src="assets/js/supabase-init.js"></script>
<script src="assets/js/auth.js"></script>
<script>
let mode = 'login'; // 'login' | 'register'

const els = {
  title: document.getElementById('auth-title'),
  sub: document.getElementById('auth-sub'),
  form: document.getElementById('auth-form'),
  email: document.getElementById('auth-email'),
  password: document.getElementById('auth-password'),
  submit: document.getElementById('auth-submit'),
  error: document.getElementById('auth-error'),
  switchText: document.getElementById('auth-switch-text'),
  switchBtn: document.getElementById('auth-switch-btn'),
};

function renderMode(){
  if(mode==='login'){
    els.title.textContent = 'Iniciar sesión';
    els.sub.textContent = 'Entra para seguir con tu formación arbitral';
    els.submit.textContent = 'Entrar';
    els.password.setAttribute('autocomplete','current-password');
    els.switchText.textContent = '¿Todavía no tienes cuenta?';
    els.switchBtn.textContent = 'Regístrate';
  } else {
    els.title.textContent = 'Crear cuenta';
    els.sub.textContent = 'Regístrate para guardar tu progreso en la nube';
    els.submit.textContent = 'Crear cuenta';
    els.password.setAttribute('autocomplete','new-password');
    els.switchText.textContent = '¿Ya tienes cuenta?';
    els.switchBtn.textContent = 'Inicia sesión';
  }
  els.error.style.display = 'none';
}

els.switchBtn.addEventListener('click', ()=>{
  mode = mode==='login' ? 'register' : 'login';
  renderMode();
});

els.form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  els.error.style.display = 'none';
  els.submit.disabled = true;
  const email = els.email.value.trim();
  const password = els.password.value;

  try{
    if(mode==='register'){
      const { data, error } = await doRegister(email, password);
      if(error){ throw error; }
      if(data && data.session){
        window.location.href = 'app.html';
      } else {
        els.error.textContent = 'Cuenta creada. Revisa tu correo para confirmar la cuenta y luego inicia sesión.';
        els.error.style.display = 'block';
        mode = 'login';
        renderMode();
        els.error.style.display = 'block';
      }
    } else {
      const { data, error } = await doLogin(email, password);
      if(error){ throw error; }
      window.location.href = 'app.html';
    }
  } catch(err){
    els.error.textContent = authErrorMessage(err);
    els.error.style.display = 'block';
  } finally {
    els.submit.disabled = false;
  }
});

(async function redirectIfLoggedIn(){
  const session = await getCurrentSession();
  if(session){ window.location.href = 'app.html'; }
})();
</script>
</body>
</html>
